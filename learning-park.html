<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>學習小樂園｜五個範疇三階段</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --paper:#fcfbfa;
  --ink:#161b32;
  --yellow:#ffed9b;
  --gold:#f0a208;
  --sky:#a1d9f7;
  --sky2:#7fc2ec;
  --pink:#f2979b;
  --hot:#ffa7f0;
  --mint:#e7fec7;
  --coral:#ea4467;
  --radius:22px;
}
html,body{height:100%}
body{
  font-family:ui-rounded,"PingFang TC","Hiragino Sans GB","Microsoft JhengHei","Noto Sans TC",sans-serif;
  color:var(--ink);
  min-height:100vh;
  display:flex;
  justify-content:center;
  background-color:var(--paper);
  background-image:
    radial-gradient(circle at 18px 18px, rgba(240,162,8,.10) 6px, transparent 7px),
    radial-gradient(circle at 46px 46px, rgba(127,194,236,.12) 6px, transparent 7px);
  background-size:56px 56px;
}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
#app{width:100%;max-width:860px;padding:16px 16px 52px;user-select:none;-webkit-user-select:none}
.screen{display:none;flex-direction:column;align-items:center;animation:fadein .3s ease}
.screen.active{display:flex}
@keyframes fadein{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

/* ===== 頂欄 ===== */
.topbar{width:100%;display:flex;justify-content:space-between;align-items:center;gap:12px;min-height:56px}
.star-pill{
  background:var(--yellow);border:4px solid var(--ink);border-radius:999px;
  padding:7px 18px;font-size:20px;font-weight:900;
  box-shadow:0 5px 0 var(--ink);letter-spacing:.5px;
}
.icon-btn{
  background:#fff;border:4px solid var(--ink);border-radius:16px;
  width:56px;height:56px;font-size:24px;display:flex;align-items:center;justify-content:center;
  box-shadow:0 5px 0 var(--ink);transition:transform .08s,box-shadow .08s;
}
.icon-btn:active{transform:translateY(5px);box-shadow:0 0 0 var(--ink)}

/* ===== 主頁 ===== */
.hero{text-align:center;margin:26px 0 6px}
.mascot{font-size:80px;display:inline-block;animation:bounce 2.4s ease-in-out infinite;filter:drop-shadow(0 8px 6px rgba(22,27,50,.18))}
@keyframes bounce{0%,100%{transform:translateY(0) rotate(-5deg)}50%{transform:translateY(-14px) rotate(5deg)}}
h1{font-size:clamp(36px,8vw,54px);font-weight:900;letter-spacing:3px;margin-top:4px}
h1 .hl{display:inline-block;background:var(--yellow);border:3px solid var(--ink);border-radius:14px;padding:0 12px;transform:rotate(-2deg);box-shadow:0 4px 0 var(--ink)}
.subtitle{margin-top:12px;font-size:16px;font-weight:700;opacity:.7}

/* 難度選擇 */
.level-select{width:100%;margin-top:24px;display:flex;flex-direction:column;gap:14px}
.level-card{
  background:#fff;border:4px solid var(--ink);border-radius:var(--radius);
  padding:18px 22px;display:flex;align-items:center;gap:16px;
  box-shadow:0 7px 0 var(--ink);transition:transform .1s,box-shadow .1s;
  animation:popin .45s backwards;text-align:left;width:100%;
  cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation;
}
.level-card:active{transform:translateY(7px);box-shadow:0 1px 0 var(--ink)}
.level-card:nth-child(1){transform:rotate(-1deg)}
.level-card:nth-child(2){transform:rotate(0.5deg)}
.level-card:nth-child(3){transform:rotate(-0.5deg)}
.level-card:active{transform:translateY(7px) rotate(0deg)}
.level-icon{width:64px;height:64px;border-radius:50%;border:4px solid var(--ink);display:flex;align-items:center;justify-content:center;font-size:34px;flex:none}
.level-info{flex:1;display:flex;flex-direction:column}
.level-name{font-size:22px;font-weight:900;letter-spacing:1px;display:block}
.level-desc{font-size:13px;font-weight:700;opacity:.6;margin-top:3px;line-height:1.5;display:block}
.level-tag{display:inline-block;background:var(--yellow);border:3px solid var(--ink);border-radius:10px;padding:2px 10px;font-size:12px;font-weight:900;margin-top:6px}

.games{width:100%;display:grid;grid-template-columns:repeat(auto-fit,minmax(158px,1fr));gap:18px;margin-top:30px}
.tile{
  background:#fff;border:4px solid var(--ink);border-radius:var(--radius);
  padding:22px 12px 18px;display:flex;flex-direction:column;align-items:center;gap:10px;
  box-shadow:0 8px 0 var(--ink);transition:transform .1s,box-shadow .1s;
  animation:popin .45s backwards;
}
.tile:nth-child(odd){transform:rotate(-1.4deg)}
.tile:nth-child(even){transform:rotate(1.2deg)}
.tile:active{transform:translateY(7px) rotate(0deg);box-shadow:0 1px 0 var(--ink)}
.tile-icon{
  width:76px;height:76px;border-radius:50%;border:4px solid var(--ink);
  display:flex;align-items:center;justify-content:center;font-size:40px;
}
.tile-name{font-size:21px;font-weight:900;letter-spacing:1px}
.tile-desc{font-size:13px;font-weight:700;opacity:.6}
@keyframes popin{from{opacity:0;transform:scale(.6)}to{opacity:1}}

.tips{width:100%;margin-top:30px;background:#fff;border:4px solid var(--ink);border-radius:var(--radius);padding:16px 20px;box-shadow:0 6px 0 var(--ink)}
.tips summary{font-weight:900;font-size:17px;cursor:pointer;list-style:none}
.tips summary::before{content:"👩‍👧 "}
.tips ul{margin:12px 0 4px 20px;line-height:2;font-size:15px;font-weight:600}
.tiny-note{margin-top:16px;font-size:12px;font-weight:600;opacity:.45}

/* ===== 遊戲頁 ===== */
.dots{display:flex;gap:8px;align-items:center}
.dot{width:15px;height:15px;border-radius:50%;background:#fff;border:3px solid var(--ink);transition:all .2s}
.dot.done{background:var(--gold)}
.dot.now{background:var(--coral);transform:scale(1.35)}
.game-title{margin:20px 0 2px;font-size:clamp(26px,6vw,36px);font-weight:900;letter-spacing:2px}
.game-body{width:100%;margin-top:16px;display:flex;flex-direction:column;align-items:center;gap:24px}

.prompt-row{display:flex;align-items:center;gap:14px;flex-wrap:wrap;justify-content:center}
.prompt{font-size:clamp(21px,5vw,29px);font-weight:900;letter-spacing:1px}
.speak-btn{
  background:var(--sky);border:4px solid var(--ink);border-radius:999px;
  height:60px;padding:0 18px;font-size:24px;flex:none;gap:6px;
  box-shadow:0 5px 0 var(--ink);transition:transform .08s,box-shadow .08s;
  display:flex;align-items:center;justify-content:center;
}
.speak-txt{font-size:15px;font-weight:900;letter-spacing:1px}
.speak-btn:active{transform:translateY(5px);box-shadow:0 0 0 var(--ink)}
.parent-hint{font-size:12px;font-weight:700;opacity:.4}

.obj-area{
  display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:10px;
  max-width:560px;min-height:120px;background:#fff;border:4px dashed var(--ink);
  border-radius:26px;padding:22px;
}
.obj{font-size:clamp(38px,8vw,56px);animation:popin .4s backwards;line-height:1}

.choices{display:flex;gap:18px;flex-wrap:wrap;justify-content:center}
.choice{
  background:#fff;border:4px solid var(--ink);border-radius:24px;
  min-width:100px;min-height:100px;padding:8px 18px;
  font-size:52px;font-weight:900;letter-spacing:-.02em;
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 7px 0 var(--ink);transition:transform .08s,box-shadow .08s;
}
.choice:active{transform:translateY(6px);box-shadow:0 1px 0 var(--ink)}
.choice.emoji{font-size:52px}
.choice.right{background:var(--mint);animation:pulse .5s}
@keyframes pulse{0%{transform:scale(1)}40%{transform:scale(1.14) rotate(2deg)}100%{transform:scale(1)}}
.shake{animation:shake .4s}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-9px)}75%{transform:translateX(9px)}}

/* 比較遊戲 */
.panels{display:flex;gap:22px;flex-wrap:wrap;justify-content:center}
.panel{
  background:#fff;border:4px solid var(--ink);border-radius:26px;
  padding:18px;width:min(300px,44vw);min-height:200px;
  display:flex;flex-wrap:wrap;gap:6px;align-items:center;justify-content:center;align-content:center;
  box-shadow:0 7px 0 var(--ink);transition:transform .08s,box-shadow .08s;
}
.panel:active{transform:translateY(6px);box-shadow:0 1px 0 var(--ink)}
.panel .obj{font-size:clamp(26px,5.5vw,38px);animation:none}
.panel.right{background:var(--mint);animation:pulse .5s}

/* 數字卡 */
.num-cards{display:grid;grid-template-columns:repeat(2,1fr);gap:16px;width:min(480px,94vw)}
.num-card{
  background:#fff;border:4px solid var(--ink);border-radius:24px;
  padding:24px 0;font-size:56px;font-weight:900;letter-spacing:-.02em;text-align:center;
  box-shadow:0 7px 0 var(--ink);transition:transform .08s,box-shadow .08s;
}
.num-card:active{transform:translateY(6px);box-shadow:0 1px 0 var(--ink)}
.num-card.right{background:var(--mint);animation:pulse .5s}

/* 規律遊戲 */
.seq-row{
  display:flex;gap:10px;flex-wrap:wrap;justify-content:center;align-items:center;
  background:#fff;border:4px dashed var(--ink);border-radius:24px;padding:18px 22px;
}
.seq-item{font-size:clamp(38px,8vw,54px);animation:popin .35s backwards;line-height:1}
.seq-blank{
  width:66px;height:66px;border:4px dashed var(--coral);border-radius:16px;
  display:flex;align-items:center;justify-content:center;
  font-size:34px;color:var(--coral);font-weight:900;animation:blink 1.2s infinite;
}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}

/* 加法 */
.add-row{display:flex;align-items:center;gap:14px;flex-wrap:wrap;justify-content:center}
.add-group{
  background:#fff;border:4px solid var(--ink);border-radius:22px;
  padding:14px 16px;display:flex;flex-wrap:wrap;gap:6px;
  max-width:240px;min-height:88px;justify-content:center;align-items:center;
}
.add-group .obj{font-size:clamp(28px,6vw,40px)}
.add-sign{font-size:46px;font-weight:900}

/* 減法 */
.sub-row{display:flex;align-items:center;gap:14px;flex-wrap:wrap;justify-content:center}
.sub-group{
  background:#fff;border:4px solid var(--ink);border-radius:22px;
  padding:14px 16px;display:flex;flex-wrap:wrap;gap:6px;
  max-width:240px;min-height:88px;justify-content:center;align-items:center;
}
.sub-group .obj{font-size:clamp(28px,6vw,40px)}
.sub-sign{font-size:46px;font-weight:900}
.sub-eq{font-size:46px;font-weight:900}

/* 雙位數加減 */
.twodigit-row{display:flex;align-items:center;gap:14px;flex-wrap:wrap;justify-content:center}
.twodigit-num{
  background:#fff;border:4px solid var(--ink);border-radius:22px;
  padding:14px 22px;font-size:clamp(32px,7vw,48px);font-weight:900;
  box-shadow:0 6px 0 var(--ink);
}
.twodigit-sign{font-size:46px;font-weight:900}

/* 時間 */
.clock-face{
  width:min(260px,70vw);height:min(260px,70vw);border:6px solid var(--ink);border-radius:50%;
  background:#fff;position:relative;box-shadow:0 8px 0 var(--ink);
}
.clock-hand{
  position:absolute;bottom:50%;left:50%;transform-origin:bottom center;
  background:var(--ink);border-radius:4px;
}
.clock-hand.hour{width:8px;height:28%;margin-left:-4px}
.clock-hand.minute{width:5px;height:40%;margin-left:-2.5px;background:var(--coral)}
.clock-dot{
  position:absolute;width:14px;height:14px;background:var(--ink);border-radius:50%;
  top:50%;left:50%;transform:translate(-50%,-50%);
}
.clock-labels{position:absolute;inset:0}
.clock-label{
  position:absolute;font-size:18px;font-weight:900;width:30px;height:30px;
  display:flex;align-items:center;justify-content:center;
}
.time-choices{display:flex;gap:14px;flex-wrap:wrap;justify-content:center;margin-top:8px}
.time-choice{
  background:#fff;border:4px solid var(--ink);border-radius:20px;
  padding:14px 24px;font-size:28px;font-weight:900;
  box-shadow:0 6px 0 var(--ink);transition:transform .08s,box-shadow .08s;
}
.time-choice:active{transform:translateY(5px);box-shadow:0 1px 0 var(--ink)}
.time-choice.right{background:var(--mint);animation:pulse .5s}

/* 形狀 */
.shapes-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;width:min(430px,94vw)}
.shape-cell{
  background:#fff;border:4px solid var(--ink);border-radius:20px;aspect-ratio:1;
  font-size:clamp(38px,9vw,56px);display:flex;align-items:center;justify-content:center;
  box-shadow:0 6px 0 var(--ink);transition:transform .08s,box-shadow .08s,opacity .2s;
}
.shape-cell:active{transform:translateY(5px);box-shadow:0 1px 0 var(--ink)}
.shape-cell.found{background:var(--mint);opacity:.5;transform:scale(.92);box-shadow:0 1px 0 var(--ink)}
.remain{display:flex;gap:8px;align-items:center;font-size:18px;font-weight:900}
.remain .rd{width:17px;height:17px;border-radius:50%;background:var(--gold);border:3px solid var(--ink)}
.remain .rd.off{background:#fff}

/* ===== 結算 ===== */
.result-card{
  margin-top:34px;background:#fff;border:4px solid var(--ink);border-radius:32px;
  padding:38px 28px;text-align:center;width:min(520px,94vw);
  box-shadow:0 10px 0 var(--ink);animation:bounceIn .6s cubic-bezier(.2,1.4,.4,1) backwards;
}
@keyframes bounceIn{from{opacity:0;transform:scale(.5)}to{opacity:1;transform:scale(1)}}
.result-emoji{font-size:90px;animation:bounce 1.8s ease-in-out infinite;display:inline-block}
.result-card h2{font-size:clamp(26px,6vw,36px);font-weight:900;margin:14px 0 6px;letter-spacing:1px}
.result-stars{font-size:42px;letter-spacing:8px;margin:10px 0}
.result-stars span{display:inline-block;animation:popin .45s backwards}
#result-msg{font-size:18px;font-weight:700;opacity:.75;margin-bottom:26px;line-height:1.7}
.result-btns{display:flex;gap:16px;justify-content:center;flex-wrap:wrap}
.btn{
  border:4px solid var(--ink);border-radius:999px;padding:16px 30px;
  font-size:20px;font-weight:900;letter-spacing:1px;
  box-shadow:0 6px 0 var(--ink);transition:transform .08s,box-shadow .08s;
}
.btn:active{transform:translateY(6px);box-shadow:0 0 0 var(--ink)}
.btn.primary{background:var(--yellow)}
.btn.ghost{background:#fff}

/* toast */
#toast{
  position:fixed;top:16px;left:50%;z-index:50;
  transform:translateX(-50%) translateY(-90px);
  background:var(--yellow);border:4px solid var(--ink);border-radius:999px;
  padding:12px 28px;font-size:21px;font-weight:900;
  box-shadow:0 6px 0 var(--ink);transition:transform .3s cubic-bezier(.2,1.4,.4,1);
  white-space:nowrap;
}
#toast.show{transform:translateX(-50%) translateY(0)}

/* confetti */
#confetti-layer{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:40}
.confetti{position:absolute;top:-40px;animation-name:fall;animation-timing-function:linear;animation-fill-mode:forwards}
@keyframes fall{to{transform:translateY(115vh) rotate(720deg);opacity:.8}}

/* 序數 */
.pet-row{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;align-items:center;background:#fff;border:4px dashed var(--ink);border-radius:24px;padding:16px 16px}
.pet{font-size:clamp(38px,9vw,56px);line-height:1;border-radius:16px;padding:6px;transition:transform .08s}
.pet:active{transform:scale(.88)}
.pet.right{background:var(--mint);animation:pulse .5s}
.count-hint{font-size:14px;font-weight:900;opacity:.5;width:100%;text-align:left}

/* 數字比大細 */
.num-panel{min-height:150px;width:min(220px,42vw)}
.panel-num{font-size:clamp(56px,15vw,88px);font-weight:900;letter-spacing:-.02em}

/* 月曆 */
.cal-wrap{background:#fff;border:4px solid var(--ink);border-radius:24px;padding:14px;box-shadow:0 7px 0 var(--ink);width:min(420px,94vw)}
.cal-title{text-align:center;font-size:24px;font-weight:900;margin-bottom:8px}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.cal-head{text-align:center;font-size:14px;font-weight:900;opacity:.55}
.cal-day{aspect-ratio:1;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:900;border:2px solid rgba(22,27,50,.12);border-radius:9px}
.cal-day.blank{visibility:hidden}

/* 位值 */
.pv-row{display:flex;gap:18px;justify-content:center;align-items:flex-end}
.pv-digit{display:flex;flex-direction:column;align-items:center;gap:8px}
.pv-num{background:#fff;border:4px solid var(--ink);border-radius:20px;width:84px;height:96px;display:flex;align-items:center;justify-content:center;font-size:56px;font-weight:900;box-shadow:0 6px 0 var(--ink)}
.pv-label{background:var(--sky);border:3px solid var(--ink);border-radius:10px;padding:2px 10px;font-size:14px;font-weight:900}

/* 應用題／拿走效果 */
.story-card{background:#fff;border:4px solid var(--ink);border-radius:24px;padding:18px 22px;font-size:clamp(18px,4.5vw,23px);font-weight:900;line-height:1.7;text-align:center;max-width:520px;box-shadow:0 6px 0 var(--ink)}
.obj.gone{opacity:.18;filter:grayscale(1)}

/* 難度標籤 */
.level-badge{
  display:inline-block;background:var(--mint);border:3px solid var(--ink);border-radius:12px;
  padding:4px 14px;font-size:14px;font-weight:900;margin-bottom:10px;
}

@media(max-width:520px){
  .choice{min-width:88px;min-height:88px;font-size:44px}
  .panel{width:min(300px,44vw);min-height:170px}
  .level-card{padding:14px 16px;gap:12px}
  .level-icon{width:52px;height:52px;font-size:28px}
  .level-name{font-size:18px}
}

/* ===== 多範疇新增 ===== */
.choice.word{font-size:clamp(20px,5vw,28px);min-width:120px;min-height:80px;padding:10px 18px;letter-spacing:0}
.choice.seq{font-size:clamp(15px,4vw,19px);min-width:min(300px,82vw);min-height:64px;padding:8px 16px;line-height:1.45}
.mem-grid{display:grid;gap:12px;width:min(430px,94vw)}
.mem-card{background:#fff;border:4px solid var(--ink);border-radius:18px;aspect-ratio:1;font-size:clamp(32px,8vw,46px);display:flex;align-items:center;justify-content:center;box-shadow:0 5px 0 var(--ink);transition:transform .08s,opacity .2s}
.mem-card:active{transform:translateY(4px);box-shadow:0 1px 0 var(--ink)}
.mem-card.open{background:var(--yellow)}
.mem-card.found{background:var(--mint);opacity:.5;transform:scale(.94);box-shadow:0 1px 0 var(--ink)}

/* ===== 心心系統 ===== */
.hearts{display:flex;justify-content:center;gap:10px;margin:0 0 10px;font-size:28px;min-height:34px}
.hearts .heart{display:inline-block;transition:all .25s}
.hearts .heart.off{filter:grayscale(1);opacity:.3}
.hearts .heart.break{animation:heartbreak .75s ease}
@keyframes heartbreak{0%{transform:scale(1)}25%{transform:scale(1.6) rotate(-14deg)}55%{transform:scale(.75) rotate(10deg)}100%{transform:scale(1)}}
.result-stars span.dim{filter:grayscale(1);opacity:.3}
.choice.tried{opacity:.4}
.pet.tried,.shape-cell.tried,.mem-card.tried,.time-choice.tried,.num-tile.tried{opacity:.4}
.tile-best{display:block;font-size:14px;margin-top:4px;letter-spacing:2px;min-height:16px}

/* 真實聲音 + 圖片題目 */
.snd-row{display:flex;justify-content:center;margin:6px 0 12px}
.snd-btn{font-size:22px;font-weight:700;padding:16px 28px;border:none;border-radius:999px;background:linear-gradient(135deg,#ffb347,#ff8c42);color:#fff;box-shadow:0 4px 0 #d96f1e;cursor:pointer}
.snd-btn:active{transform:translateY(3px);box-shadow:0 1px 0 #d96f1e}
.qimg{display:block;width:min(76vw,340px);max-height:210px;object-fit:cover;margin:2px auto 12px;border-radius:16px;box-shadow:0 4px 12px rgba(0,0,0,.18);border:3px solid #fff}
</style>
</head>
<body>
<div id="js-check" style="position:sticky;top:0;z-index:99;background:#ffd40e;color:#161b32;border-bottom:4px solid #161b32;padding:12px 16px;font-weight:900;font-size:15px;line-height:1.6;text-align:center">⚠️ 見到呢句＝你而家嘅檢視器閂咗 JavaScript，遊戲開唔到。<br>請改用 Safari／Chrome 瀏覽器開呢個檔案。</div>
<div id="app">

  <!-- 主頁 -->
  <section id="home" class="screen active">
    <div class="topbar">
      <div style="display:flex;align-items:center;gap:12px">
        <button id="back-btn-home" class="icon-btn" style="display:none" aria-label="返回">🔙</button>
        <div class="star-pill">⭐ <span id="home-stars">0</span></div>
      </div>
      <button id="sound-btn" class="icon-btn" aria-label="聲音開關">🔊</button>

// ===== 聲音 =====
let soundOn=true,actx=null;
function ac(){
  if(!actx){try{actx=new (window.AudioContext||window.webkitAudioContext)()}catch(e){}}
  if(actx&&actx.state==='suspended')actx.resume();
  return actx;
}
function tone(f,dur,type,delay,vol){
  if(!soundOn)return;const c=ac();if(!c)return;
  type=type||'sine';delay=delay||0;vol=vol||0.18;
  const o=c.createOscillator(),g=c.createGain();
  o.type=type;o.frequency.value=f;
  const t=c.currentTime+delay;
  g.gain.setValueAtTime(0.0001,t);
  g.gain.exponentialRampToValueAtTime(vol,t+0.02);
  g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  o.connect(g);g.connect(c.destination);
  o.start(t);o.stop(t+dur+0.05);
}
const sfx={
  pop(){tone(720,.07,'square',0,.07)},
  correct(){tone(523,.12);tone(659,.12,'sine',.1);tone(784,.24,'sine',.2)},
  wrong(){tone(233,.18,'triangle',0,.12);tone(196,.24,'triangle',.12,.12)},
  win(){[523,659,784,1047].forEach((f,i)=>tone(f,.16,'sine',i*.13,.16));tone(1319,.45,'sine',.56,.16)}
};
function speak(text,lang){
  if(!soundOn)return;
  try{
    if(!('speechSynthesis'in window))return;
    const u=new SpeechSynthesisUtterance(text);
    u.lang=lang||'zh-HK';u.rate=.9;u.pitch=1.15;
    window.speechSynthesis.cancel();
    window.speechSynthesis.speak(u);
  }catch(e){}
}

function show(id){document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));$('#'+id).classList.add('active')}
const PRAISE=['好叻呀！🎉','叻女！🌟','答啱咗！👏','勁呀！💪','好厲害！✨'];
const TRYAGAIN=['差少少，再試下！','唔緊要，慢慢嚟！','再睇清楚啲！','試下數多一次！'];
let toastTimer=null;
function toast(msg){
  const t=$('#toast');t.textContent=msg;t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>t.classList.remove('show'),1300);
}
function confetti(n){
  const layer=$('#confetti-layer');
  const E=['🎉','⭐','✨','🌟','🎈','💖','🧸'];
  for(let i=0;i<n;i++){
    const s=document.createElement('span');
    s.className='confetti';s.textContent=pick(E);
    s.style.left=(Math.random()*100)+'vw';
    s.style.fontSize=(16+Math.random()*22)+'px';
    s.style.animationDuration=(2.2+Math.random()*1.8)+'s';
    s.style.animationDelay=(Math.random()*.6)+'s';
    layer.appendChild(s);
    setTimeout(()=>s.remove(),4800);
  }
}
function updateStarPills(){$('#home-stars').textContent=state.stars}


// ===== 遊戲引擎 =====
function updateDots(){
  const d=$('#dots');d.innerHTML='';
  for(let i=1;i<=state.rounds;i++){
    const s=document.createElement('span');
    s.className='dot'+(i<state.round?' done':i===state.round?' now':'');
    d.appendChild(s);
  }
}
function newRoundFlags(){state.mistake=false;state.answered=false}
function renderHearts(breakIdx){
  const h=$('#hearts');if(!h)return;
  h.innerHTML='';
  for(let i=0;i<3;i++){
    const s=document.createElement('span');
    s.className='heart'+(i<state.hearts?'':' off');
    s.textContent=i<state.hearts?'❤️':'🖤';
    if(i===breakIdx)s.classList.add('break');
    h.appendChild(s);
  }
}
function startGame(id){
  state.game=id;state.round=1;state.firstTry=0;state.hearts=3;newRoundFlags();
  renderHearts();
  const cfg=SUBJECTS[state.subject].levels[state.level].meta.find(m=>m.id===id);
  $('#game-title').textContent=cfg.name;
  $('#level-badge').textContent=SUBJECTS[state.subject].levels[state.level].badge;
  show('game');updateDots();
  GAMES[id].round();
}
function wrongAttempt(el){
  if(state.answered||state.hearts<=0)return;
  if(el){if(el.classList.contains('tried'))return;el.classList.add('tried')}
  state.mistake=true;state.hearts--;sfx.wrong();
  renderHearts(state.hearts);
  if(el){el.classList.remove('shake');void el.offsetWidth;el.classList.add('shake')}
  if(state.hearts<=0){setTimeout(gameOver,1100)}
  else toast(pick(TRYAGAIN)+'（仲有 '+state.hearts+' 個 ❤️）');
}
function gameOver(){
  show('gameover');
  const done=state.round-1;
  $('#over-msg').textContent=done>0
    ?'你答啱咗 '+done+' 題！休息吓，再挑戰過啦！'
    :'唔緊要！慢慢嚟，再試過啦！';
  speak('心心用完喇，唔緊要，休息吓再玩過！');
  sfx.wrong();
}
function succeed(el){
  if(state.answered)return;
  state.answered=true;
  if(el)el.classList.add('right');
  sfx.correct();toast(pick(PRAISE));
  if(!state.mistake)state.firstTry++;
  setTimeout(()=>{
    state.round++;
    if(state.round>state.rounds){endGame()}
    else{newRoundFlags();updateDots();GAMES[state.game].round()}
  },1300);
}
function endGame(){
  const earned=Math.max(1,state.hearts);
  state.stars+=earned;saveStars();updateStarPills();
  const best=getBest();
  if(earned>(best[state.game]||0)){best[state.game]=earned;saveBest(best)}
  show('result');
  $('#result-emoji').textContent=earned===3?'🏆':earned===2?'🎉':'💪';
  $('#result-title').textContent=earned===3?'完美過關！':earned===2?'好叻呀！':'完成咗！';
  const rs=$('#result-stars');rs.innerHTML='';
  for(let i=0;i<3;i++){
    const s=document.createElement('span');
    s.textContent=i<earned?'⭐':'☆';
    s.style.animationDelay=(i*.18)+'s';
    if(i>=earned)s.classList.add('dim');
    rs.appendChild(s);
  }
  $('#result-msg').textContent=(earned===3
    ?'五題全對，三個心心都喺晒，拎到 3 粒星！'
    :earned===2?'五題完成，淨返兩個心心，拎到 2 粒星！'
    :'五題完成，剩返一個心心，拎到 1 粒星！下次加油拎 3 粒！')
    +'（總星星：'+state.stars+' ⭐）';
  speak(earned===3?'叻呀！五題全對！':'完成咗！攞到 '+earned+' 粒星！');
  confetti(earned===3?90:earned===2?50:25);
  sfx.win();
}
function makeChoices(n,min,max,count){
  const s=new Set([n]);let guard=0;
  while(s.size<count&&guard<200){
    guard++;
    let c=n+rand(-3,3);
    if(c<min)c=min;if(c>max)c=max;
    if(c!==n)s.add(c);
  }
  return shuffle([...s]);
}
function bindCommon(){
  const sb=$('#game-body').querySelector('.speak-btn');
  if(sb)sb.onclick=()=>speak(sb.dataset.say,sb.dataset.lang);
}

const bigE=e=>`<div class="obj-area"><span class="obj" style="font-size:clamp(70px,18vw,110px)">${e}</span></div>`;
function pickOthers(pool,exclude,n){return shuffle(pool.filter(x=>x!==exclude)).slice(0,n)}
function askQ(cfg){
  const lang=cfg.lang?` data-lang="${cfg.lang}"`:'';
  $('#game-body').innerHTML=`
    <div class="prompt-row"><button class="speak-btn" data-say="${cfg.say}"${lang}>🔊<span class="speak-txt">再聽多次</span></button>${cfg.prompt!==undefined?`<p class="prompt">${cfg.prompt}</p>`:''}</div>
    ${cfg.body||''}
    <div class="choices">${shuffle(cfg.opts.slice()).map(o=>`<button class="choice ${cfg.cls||''}" data-v="${o}">${o}</button>`).join('')}</div>`;
  if(cfg.say)speak(cfg.say,cfg.lang);
  bindCommon();
  $('#game-body').querySelectorAll('.choice').forEach(b=>b.onclick=()=>{
    if(state.answered)return;
    if(String(b.dataset.v)===String(cfg.ans)){succeed(b);if(cfg.winSay)setTimeout(()=>speak(cfg.winSay,cfg.lang),650);}else wrongAttempt(b);
  });
}

    const emojis=shuffle(MEM_POOL.slice()).slice(0,pairs);

    const say='記住佢哋嘅位置，搵出一對一對！';
    $('#game-body').innerHTML=`
      <div class="prompt-row"><button class="speak-btn" data-say="${say}">🔊<span class="speak-txt">再聽多次</span></button><p class="prompt">搵出一對一對！</p></div>

    speak(say);
    bindCommon();
    $('#game-body').querySelectorAll('.mem-card').forEach(b=>b.onclick=()=>{
      if(state.answered||lock||b.classList.contains('found')||b.classList.contains('open'))return;
      b.classList.add('open');b.textContent=cards[+b.dataset.i];sfx.pop();
      if(!first){first=b;return}
      lock=true;
      if(cards[+first.dataset.i]===cards[+b.dataset.i]){
        first.classList.add('found');b.classList.add('found');
        first=null;lock=false;left--;
        if(left===0)succeed(null);
      }else{
        const f=first;first=null;
        setTimeout(()=>{f.classList.remove('open');b.classList.remove('open');f.textContent='❓';b.textContent='❓';lock=false},750);
      }
    });
  }},
  th_diff:{round(){
    const n=state.level==='beginner'?4:state.level==='intermediate'?6:8;
    const pair=draw(TH_DIFF),swap=Math.random()<.5;

      const opts=new Set([ans]);let g=0;
      while(opts.size<3&&g<100){g++;const c=ans+rand(-3,3);if(c>=1&&c<=days&&c!==ans)opts.add(c)}
      choices=shuffle([...opts]).map(c=>`<button class="time-choice" data-v="${c}">${c} 號</button>`);
    }else if(state.round===4){
      ans=days;
      q=month+' 月一共有幾多日？';
      const opts=new Set([ans]);
      [28,29,30,31].forEach(x=>{if(opts.size<3&&x!==ans)opts.add(x)});
      choices=shuffle([...opts]).map(c=>`<button class="time-choice" data-v="${c}">${c} 日</button>`);
    }else{
      const w=rand(0,6),nth=rand(1,2);
      let count=0,d=1;
      for(let i=1;i<=days;i++){if(wdOf(i)===w){count++;if(count===nth){d=i;break}}}
      ans=d;
      q=month+' 月第 '+nth+' 個星期'+WD[w]+' 係幾多號？';
      const opts=new Set([ans]);let g=0;
      while(opts.size<3&&g<100){g++;const c=ans+rand(-7,7);if(c>=1&&c<=days&&c!==ans)opts.add(c)}
      choices=shuffle([...opts]).map(c=>`<button class="time-choice" data-v="${c}">${c} 號</button>`);
    }
    $('#game-body').innerHTML=`
      <div class="prompt-row"><button class="speak-btn" data-say="${q}">🔊<span class="speak-txt">再聽多次</span></button><p class="prompt">${q}</p></div>
      ${grid}
      <div class="time-choices">${choices.join('')}</div>`;
    speak(q);
    bindCommon();
    $('#game-body').querySelectorAll('.time-choice').forEach(b=>b.onclick=()=>{
      if(state.answered)return;
      if(String(b.dataset.v)===String(ans))succeed(b);else wrongAttempt(b);
    });
  }},

  // === 十位個位（位值，進階）===
  placevalue:{round(){
    const t=rand(1,9),o=rand(0,9),num=t*10+o;
    let q,ans,choices;
    if(state.round<=2){
      ans=t;
      q=num+' 入面有幾多個十？';
      const opts=new Set([t]);while(opts.size<3){const c=rand(0,9);if(c!==t)opts.add(c)}
      choices=shuffle([...opts]).map(c=>`<button class="choice" data-v="${c}">${c}</button>`);
    }else if(state.round<=4){
      ans=o;
      q=num+' 入面有幾多個一？';
      const opts=new Set([o]);while(opts.size<3){const c=rand(0,9);if(c!==o)opts.add(c)}
      choices=shuffle([...opts]).map(c=>`<button class="choice" data-v="${c}">${c}</button>`);
    }else{
      ans=num;
      q=t+' 個十同 '+o+' 個一，合埋係幾多？';
      const opts=new Set([num]);
      const rev=o*10+t;if(rev!==num&&rev>0&&opts.size<3)opts.add(rev);
      while(opts.size<3){const c=rand(10,99);if(c!==num)opts.add(c)}
      choices=shuffle([...opts]).map(c=>`<button class="choice" data-v="${c}">${c}</button>`);
    }
    $('#game-body').innerHTML=`
      <div class="prompt-row"><button class="speak-btn" data-say="${q}">🔊<span class="speak-txt">再聽多次</span></button><p class="prompt">${q}</p></div>
      <div class="pv-row">
        <div class="pv-digit"><div class="pv-num">${t}</div><span class="pv-label">十位</span></div>
        <div class="pv-digit"><div class="pv-num">${o}</div><span class="pv-label">個位</span></div>
      </div>
      <div class="choices">${choices.join('')}</div>`;
    speak(q);
    bindCommon();
    $('#game-body').querySelectorAll('.choice').forEach(b=>b.onclick=()=>{
      if(state.answered)return;
      if(+b.dataset.v===ans)succeed(b);else wrongAttempt(b);
    });
  }},

  // === 跳數規律（進階）===
  skipcount:{round(){
    let step,start,down=false;
    if(state.round<=2)step=2;
    else if(state.round===3)step=5;
    else if(state.round===4)step=10;
    else{step=pick([2,5]);down=true}
    if(down)start=rand(30,80);
    else if(step===2)start=rand(1,20);
    else if(step===5)start=rand(1,25);
    else start=rand(5,40);
    const seq=[];for(let i=0;i<4;i++)seq.push(down?start-i*step:start+i*step);
    const ans=down?start-4*step:start+4*step;
    const opts=new Set([ans]);let g=0;
    while(opts.size<3&&g<100){g++;const c=ans+pick([-2,-1,1,2])*step;if(c>0&&c!==ans)opts.add(c)}
    const say='跳住數，跟住落嚟係幾多？';
    $('#game-body').innerHTML=`
      <div class="prompt-row"><button class="speak-btn" data-say="${say}">🔊<span class="speak-txt">再聽多次</span></button><p class="prompt">跳住數，跟住落嚟係幾多？</p></div>
      <div class="seq-row">${seq.map((e,i)=>`<span class="seq-item" style="animation-delay:${i*0.1}s">${e}</span>`).join('')}<span class="seq-blank">?</span></div>
      <div class="choices">${shuffle([...opts]).map(c=>`<button class="choice" data-v="${c}">${c}</button>`).join('')}</div>`;
    speak(say);
    bindCommon();
    $('#game-body').querySelectorAll('.choice').forEach(b=>b.onclick=()=>{
      if(state.answered)return;
      if(+b.dataset.v===ans)succeed(b);else wrongAttempt(b);
    });
  }},

  // === 故事應用題（進階）===
  wordprob:{round(){
    const NAMES=['小明','小華','家欣','阿樂','芷晴'];
    const ITEMS=[['🍬','粒糖','食咗'],['🎈','個氣球','飛走咗'],['⭐','張貼紙','俾咗朋友'],['🐟','條魚','游走咗'],['📚','本書','借咗俾朋友'],['🍪','塊餅','食咗']];
    const name=pick(NAMES),it=pick(ITEMS),emoji=it[0],unit=it[1],verb=it[2];
    const isAdd=Math.random()<.5;
    let a,b,n,story,objsHtml;
    if(isAdd){
      a=rand(4,10);b=rand(3,Math.min(9,20-a));n=a+b;
      story=name+'有 '+a+' '+unit+'，再買多 '+b+' '+unit+'，一共有幾多'+unit+'？';
      objsHtml=`<div class="add-row"><div class="add-group">${Array.from({length:a},()=>`<span class="obj">${emoji}</span>`).join('')}</div><span class="add-sign">＋</span><div class="add-group">${Array.from({length:b},()=>`<span class="obj">${emoji}</span>`).join('')}</div></div>`;
    }else{
      n=rand(3,9);a=rand(n+2,Math.min(18,n+9));b=a-n;
      story=name+'有 '+a+' '+unit+'，'+verb+' '+b+' '+unit+'，仲有幾多'+unit+'？';
      objsHtml=`<div class="obj-area">${Array.from({length:a},(_,i)=>`<span class="obj${i>=n?' gone':''}">${emoji}</span>`).join('')}</div>`;
    }
    const choices=makeChoices(n,1,20,3);
    $('#game-body').innerHTML=`
      <div class="prompt-row"><button class="speak-btn" data-say="${story}">🔊<span class="speak-txt">再聽多次</span></button></div>
      <div class="story-card">${story}</div>
      ${objsHtml}
      <div class="choices">${choices.map(c=>`<button class="choice" data-v="${c}">${c}</button>`).join('')}</div>`;
    speak(story);
    bindCommon();
    $('#game-body').querySelectorAll('.choice').forEach(b=>b.onclick=()=>{
      if(state.answered)return;
      if(+b.dataset.v===n)succeed(b);else wrongAttempt(b);
    });
  }}
};
Object.assign(GAMES,ZH_GAMES,EN_GAMES,GS_GAMES,TH_GAMES);

// ===== 主頁三層導航 =====
function renderTips(arr){
  const tips=$('#tips-content');tips.innerHTML='';
  arr.forEach(t=>{const li=document.createElement('li');li.textContent=t;tips.appendChild(li)});
}
function showSubjectSelect(){
  $('#back-btn-home').style.display='none';
  $('#subject-select').style.display='flex';
  $('#level-select').style.display='none';
  $('#game-list').style.display='none';
  $('#parent-tips').style.display='block';
  renderTips(GENERAL_TIPS);
  $('#subtitle').textContent='五個範疇 ・ 三個階段 ・ 每日 10 分鐘';
}
function showLevelSelect(){
  $('#back-btn-home').style.display='flex';
  $('#subject-select').style.display='none';
  $('#level-select').style.display='flex';
  $('#game-list').style.display='none';
  $('#parent-tips').style.display='block';
  const S=SUBJECTS[state.subject];
  ['beginner','intermediate','advanced'].forEach(lv=>{
    $('#ldesc-'+lv).textContent=S.levels[lv].cardDesc;
    $('#ltag-'+lv).textContent=S.levels[lv].cardTag;
  });
  renderTips(S.tips);
  $('#subtitle').textContent=S.icon+' '+S.name+'練習 ・ 揀一個階段';
}
function showGameList(){
  $('#back-btn-home').style.display='flex';
  $('#subject-select').style.display='none';
  $('#level-select').style.display='none';
  $('#game-list').style.display='grid';
  $('#parent-tips').style.display='block';
  const L=SUBJECTS[state.subject].levels[state.level];
  const g=$('#game-list');g.innerHTML='';
  L.meta.forEach((m,i)=>{
    const b=document.createElement('button');
    b.className='tile';
    b.style.animationDelay=(i*0.07)+'s';
    const bs=getBest()[m.id]||0;
    b.innerHTML=`<span class="tile-icon" style="background:${m.c}">${m.icon}</span><span class="tile-name">${m.name}</span><span class="tile-desc">${m.desc}</span><span class="tile-best">${bs?'⭐'.repeat(bs)+'☆'.repeat(3-bs):'未玩過'}</span>`;
    b.onclick=()=>{sfx.pop();startGame(m.id)};
    g.appendChild(b);
  });
  renderTips(L.tips);
  const S=SUBJECTS[state.subject];
  $('#subtitle').textContent=S.icon+' '+S.name+' ・ '+L.badge;
}

// 範疇卡
$('#subject-select').querySelectorAll('.subject-card').forEach(card=>{
  card.onclick=()=>{sfx.pop();state.subject=card.dataset.subject;showLevelSelect()};
});
// 階段卡
$('#level-select').querySelectorAll('.level-card').forEach(card=>{
  card.onclick=()=>{sfx.pop();state.level=card.dataset.level;showGameList()};
});
// 返回掣
$('#back-btn-home').onclick=()=>{
  sfx.pop();
  if($('#game-list').style.display==='grid')showLevelSelect();
  else showSubjectSelect();
};

// ===== 全域按鈕 =====
function toggleSound(){
  soundOn=!soundOn;
  const ic=soundOn?'🔊':'🔇';
  $('#sound-btn').textContent=ic;
  $('#sound-btn2').textContent=ic;
  if(!soundOn){try{window.speechSynthesis.cancel()}catch(e){}}
  else sfx.pop();
}
$('#sound-btn').onclick=toggleSound;
$('#sound-btn2').onclick=toggleSound;
$('#home-btn').onclick=()=>{sfx.pop();show('home');showGameList();updateStarPills()};
$('#again-btn').onclick=()=>{sfx.pop();startGame(state.game)};
$('#over-again-btn').onclick=()=>{sfx.pop();startGame(state.game)};
$('#over-back-btn').onclick=()=>{sfx.pop();show('home');showGameList();updateStarPills()};
$('#back-btn').onclick=()=>{sfx.pop();show('home');showGameList();updateStarPills()};

// 初始化
updateStarPills();
showSubjectSelect();
try{const jc=document.getElementById('js-check');if(jc)jc.style.display='none';}catch(e){}

</script>
