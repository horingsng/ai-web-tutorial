<style>
.sl-card{max-width:520px;margin:0 auto;background:#1e293b;border:1px solid #334155;border-radius:16px;padding:1.5rem;text-align:center;}
.sl-upload{border:2px dashed #475569;border-radius:12px;padding:2rem 1rem;color:#94a3b8;cursor:pointer;transition:border-color .2s;}
.sl-upload:hover{border-color:#38bdf8;color:#7dd3fc;}
.sl-upload .sl-icon{font-size:2.5rem;display:block;margin-bottom:.5rem;}
.sl-arena{display:none;}
.sl-arena.sl-on{display:block;}
.sl-target{position:relative;width:100%;max-width:320px;margin:0 auto;border-radius:16px;overflow:hidden;cursor:pointer;user-select:none;-webkit-user-select:none;touch-action:manipulation;}
.sl-target img{width:100%;display:block;pointer-events:none;}
.sl-target.sl-hit{animation:slap .18s ease;}
@keyframes slap{0%{transform:rotate(0) scale(1);}30%{transform:rotate(-6deg) scale(.96);}60%{transform:rotate(4deg) scale(1.02);}100%{transform:rotate(0) scale(1);}}
.sl-pow{position:absolute;font-size:1.8rem;pointer-events:none;animation:pow .5s ease forwards;}
@keyframes pow{from{opacity:1;transform:scale(1) translateY(0);}to{opacity:0;transform:scale(1.8) translateY(-40px);}}
.sl-count{margin:1rem 0 .5rem;font-size:1.2rem;color:#f1f5f9;}
.sl-count b{color:#7dd3fc;font-size:1.8rem;}
.sl-msg{color:#94a3b8;font-size:.9rem;min-height:1.4rem;}
.sl-reset{background:none;border:1px solid #475569;color:#94a3b8;border-radius:10px;padding:.5rem 1rem;margin-top:.8rem;cursor:pointer;font-size:.9rem;}
.sl-note{color:#64748b;font-size:.8rem;margin-top:1rem;}
</style>

<body>
<header>
    <nav>
        <a class="logo" href="../index.html">AI<span>建站</span>教學</a>

            <li><a href="../index.html#tool">Prompt生成器</a></li>

</header>

<main class="container">
    <div class="breadcrumb"><a href="../index.html">首頁</a> › 免費工具 › 出氣相靶</div>
    <h1 style="text-align:center;margin:1rem 0 0.5rem;">👋 出氣相靶</h1>
    <p style="text-align:center;color:#94a3b8;margin-bottom:1.5rem;">上載張相，狂摑出氣・張相唔會離開你部機</p>
    <div class="sl-card">
        <div class="sl-upload" id="slUpload">
            <span class="sl-icon">🖼️</span>
            撳呢度上載張相<br>
            <small>（老細？前度？星期一？你話事）</small>
        </div>
        <input type="file" id="slFile" accept="image/*" style="display:none;">
        <div class="sl-arena" id="slArena">
            <div class="sl-target" id="slTarget">
                <img id="slImg" alt="出氣相靶">
            </div>
            <div class="sl-count">已摑 <b id="slNum">0</b> 吓</div>
            <div class="sl-msg" id="slMsg">摑啦，唔使客氣。</div>
            <button class="sl-reset" id="slReset">🔄 換張相</button>

<script>
const $ = id => document.getElementById(id);
let count = 0, audioCtx = null;

$('slUpload').onclick = () => $('slFile').click();
$('slReset').onclick = () => $('slFile').click();

$('slFile').onchange = e => {
  const f = e.target.files[0];
  if(!f) return;
  const r = new FileReader();
  r.onload = ev => {
    $('slImg').src = ev.target.result;
    $('slUpload').style.display = 'none';
    $('slArena').classList.add('sl-on');
    count = 0; $('slNum').textContent = 0;
    $('slMsg').textContent = '摑啦，唔使客氣。';
  };
  r.readAsDataURL(f);
  e.target.value = '';
};

function slapSound(){
  audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
  const t = audioCtx.currentTime;
  const buf = audioCtx.createBuffer(1, audioCtx.sampleRate * 0.08, audioCtx.sampleRate);
  const d = buf.getChannelData(0);
  for(let i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / d.length, 2);
  const src = audioCtx.createBufferSource();
  src.buffer = buf;
  const g = audioCtx.createGain();
  g.gain.setValueAtTime(0.6, t);
  g.gain.exponentialRampToValueAtTime(0.01, t + 0.08);
  src.connect(g); g.connect(audioCtx.destination);
  src.start();
}

const msgs = [
  [10, '唔錯，開始有火。'],
  [30, '啪啪啪，啲氣出緊喇。'],
  [50, '老細：我做錯咗咩……'],
  [100, '一百吓！你今日真係受咗好多委屈。'],
  [200, '兩百吓！建議你放假。'],
  [500, '五百吓！！呢個唔係遊戲，係治療。'],
  [1000, '一千吓。你贏咗，張相已經唔敢郁。']
];

$('slTarget').addEventListener('pointerdown', e => {
  count++;
  $('slNum').textContent = count;
  const t = $('slTarget');
  t.classList.remove('sl-hit');
  void t.offsetWidth;
  t.classList.add('sl-hit');
  slapSound();
  const pow = document.createElement('span');
  pow.className = 'sl-pow';
  pow.textContent = ['💥','👋','💢','⭐'][count % 4];
  const r = t.getBoundingClientRect();
  pow.style.left = (e.clientX - r.left - 14) + 'px';
  pow.style.top = (e.clientY - r.top - 14) + 'px';
  t.appendChild(pow);
  setTimeout(() => pow.remove(), 500);
  for(const [n, m] of msgs) if(count === n) $('slMsg').textContent = m;
});
</script>
</body>
