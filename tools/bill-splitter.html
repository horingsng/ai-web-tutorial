<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="description" content="免費AA制分帳工具：逐項消費剔選有份者、加一服務費按比例攤分、唔均分都計到，結果一撳複製貼去WhatsApp。人名自動記住，下次直接用。">
    <link rel="stylesheet" href="../style.css">
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-5952182039504663" crossorigin="anonymous"></script>
<style>
.aa-card{max-width:560px;margin:0 auto;background:#1e293b;border:1px solid #334155;border-radius:16px;padding:1.5rem;}
.aa-sec{margin-bottom:1.4rem;}
.aa-sec h2{font-size:1.05rem;color:#7dd3fc;margin-bottom:.6rem;}
.aa-names{display:flex;flex-wrap:wrap;gap:.5rem;margin-bottom:.6rem;}
.aa-chip{background:#0f172a;border:1px solid #475569;color:#f1f5f9;border-radius:999px;padding:.35rem .9rem;font-size:.95rem;display:inline-flex;align-items:center;gap:.4rem;}
.aa-chip button{background:none;border:none;color:#f87171;cursor:pointer;font-size:1rem;line-height:1;padding:0;}
.aa-addrow{display:flex;gap:.5rem;}
.aa-input{flex:1;background:#0f172a;border:1px solid #475569;color:#f1f5f9;border-radius:10px;padding:.7rem .9rem;font-size:1rem;min-width:0;}
.aa-input:focus{outline:none;border-color:#38bdf8;}
.aa-btn{background:#0ea5e9;border:none;color:#fff;border-radius:10px;padding:.7rem 1.1rem;font-size:1rem;cursor:pointer;}
.aa-btn:active{transform:scale(.96);}
.aa-item{background:#0f172a;border:1px solid #334155;border-radius:12px;padding:.8rem;margin-bottom:.6rem;}
.aa-item-head{display:flex;gap:.5rem;align-items:center;}
.aa-item-head .aa-name{flex:1;color:#f1f5f9;}
.aa-item-head .aa-amt{width:7rem;}
.aa-who{display:flex;flex-wrap:wrap;gap:.4rem;margin-top:.6rem;}
.aa-who label{background:#1e293b;border:1px solid #475569;border-radius:8px;padding:.3rem .7rem;font-size:.85rem;color:#94a3b8;cursor:pointer;}
.aa-who input{accent-color:#0ea5e9;margin-right:.3rem;}
.aa-who label:has(input:checked){border-color:#0ea5e9;color:#7dd3fc;background:#0c2233;}
.aa-del{background:none;border:none;color:#f87171;cursor:pointer;font-size:.95rem;}
.aa-svc{display:flex;align-items:center;gap:.5rem;color:#94a3b8;font-size:.95rem;user-select:none;}
.aa-svc input{accent-color:#0ea5e9;width:1.1rem;height:1.1rem;}
.aa-result{background:#0f172a;border:1px solid #0ea5e9;border-radius:12px;padding:1rem;margin-top:.4rem;}
.aa-line{display:flex;justify-content:space-between;padding:.35rem 0;color:#f1f5f9;border-bottom:1px dashed #1e293b;}
.aa-line:last-child{border-bottom:none;}
.aa-line b{color:#7dd3fc;}
.aa-total{text-align:center;color:#94a3b8;font-size:.9rem;margin-top:.6rem;}
.aa-copy{width:100%;margin-top:.8rem;background:#22c55e;border:none;color:#052e16;font-weight:700;border-radius:10px;padding:.8rem;font-size:1rem;cursor:pointer;}
.aa-copy:active{transform:scale(.97);}
</style>
</head>
<body>
<header>
    <nav>
        <a class="logo" href="../index.html">AI<span>建站</span>教學</a>
        <ul class="nav-links">
            <li><a href="../index.html#tool">Prompt生成器</a></li>
            <li><a href="../index.html#articles">教學文章</a></li>
            <li><a href="../index.html#features">為何選我們</a></li>
        </ul>
    </nav>
</header>

<main class="container">
    <div class="breadcrumb"><a href="../index.html">首頁</a> › 免費工具 › AA制分帳器</div>
    <h1 style="text-align:center;margin:1rem 0 0.5rem;">🍻 AA制分帳器</h1>
    <p style="text-align:center;color:#94a3b8;margin-bottom:1.5rem;">唔均分・加一攤分・結果直接貼 WhatsApp</p>
    <div class="aa-card">
        <div class="aa-sec">
            <h2>👥 有咩人</h2>
            <div class="aa-names" id="aaNames"></div>
            <div class="aa-addrow">
                <input class="aa-input" id="aaNewName" placeholder="輸入人名，例：阿明" maxlength="10">
                <button class="aa-btn" id="aaAddName">加人</button>
            </div>
        </div>
        <div class="aa-sec">
            <h2>🧾 消費項目</h2>
            <div id="aaItems"></div>
            <div class="aa-addrow">
                <input class="aa-input" id="aaNewItem" placeholder="項目，例：火鍋" maxlength="12">
                <input class="aa-input" id="aaNewAmt" type="number" inputmode="decimal" placeholder="$金額" min="0" style="max-width:7rem;">
                <button class="aa-btn" id="aaAddItem">加項</button>
            </div>
        </div>
        <div class="aa-sec">
            <label class="aa-svc"><input type="checkbox" id="aaSvc" checked> 加一服務費（10%，按每人比例攤分）</label>
        </div>
        <div class="aa-sec">
            <h2>💰 每人應俾</h2>
            <div class="aa-result" id="aaResult"><div class="aa-total">加咗人同項目先計到數～</div></div>
            <button class="aa-copy" id="aaCopy">📋 複製結果，貼去 WhatsApp</button>
        </div>
    </div>

    <div class="ad-container" style="margin:2rem auto;max-width:728px;text-align:center;">
        <ins class="adsbygoogle" style="display:block"
             data-ad-client="ca-pub-5952182039504663"
             data-ad-slot="XXXXXXXXXX"
             data-ad-format="auto"
             data-full-width-responsive="true"></ins>
        <script>(adsbygoogle = window.adsbygoogle || []).push({});</script>
    </div>
</main>

<footer>
    <div class="container">
        <div class="footer-links">
            <a href="../about.html">關於我們</a>
            <a href="../privacy.html">隱私政策</a>
            <a href="../contact.html">聯絡我們</a>
            <a href="../disclaimer.html">免責聲明</a>
        </div>
        <p class="copyright">© 2026 AI建站教學. 所有教學內容免費提供，歡迎分享。</p>
    </div>
</footer>
<script>
let names = JSON.parse(localStorage.getItem('aaNames') || '[]');
let items = [];
const $ = id => document.getElementById(id);

function renderNames(){
  $('aaNames').innerHTML = names.map((n,i) =>
    `<span class="aa-chip">${n}<button onclick="delName(${i})">✕</button></span>`).join('');
  localStorage.setItem('aaNames', JSON.stringify(names));
}
function delName(i){ names.splice(i,1); renderNames(); }
$('aaAddName').onclick = () => {
  const v = $('aaNewName').value.trim();
  if(v && !names.includes(v)){ names.push(v); renderNames(); }
  $('aaNewName').value = '';
};
renderNames();

function renderItems(){
  $('aaItems').innerHTML = items.map((it,i) => `
    <div class="aa-item">
      <div class="aa-item-head">
        <span class="aa-name">${it.name}</span>
        <input class="aa-input aa-amt" type="number" value="${it.amt}" min="0" onchange="setAmt(${i},this.value)">
        <button class="aa-del" onclick="delItem(${i})">刪除</button>
      </div>
      <div class="aa-who">
        ${names.map((n,j) => `<label><input type="checkbox" ${it.who.includes(j)?'checked':''} onchange="toggleWho(${i},${j})">${n}</label>`).join('')}
      </div>
    </div>`).join('');
}
function setAmt(i,v){ items[i].amt = parseFloat(v) || 0; calc(); }
function delItem(i){ items.splice(i,1); renderItems(); calc(); }
function toggleWho(i,j){
  const k = items[i].who.indexOf(j);
  if(k >= 0) items[i].who.splice(k,1); else items[i].who.push(j);
  calc();
}
$('aaAddItem').onclick = () => {
  const n = $('aaNewItem').value.trim(), a = parseFloat($('aaNewAmt').value) || 0;
  if(n && a > 0 && names.length){ items.push({name:n, amt:a, who:[...names.keys()]}); renderItems(); }
  $('aaNewItem').value = ''; $('aaNewAmt').value = '';
};
const _rn = renderNames;
renderNames = function(){ _rn(); renderItems(); calc(); };

const fmt = n => '$' + n.toFixed(2).replace(/\.00$/, '');
function calc(){
  const box = $('aaResult');
  if(!names.length || !items.length){
    box.innerHTML = '<div class="aa-total">加咗人同項目先計到數～</div>'; return;
  }
  const svc = $('aaSvc').checked ? 1.1 : 1;
  const totals = names.map(() => 0);
  let grand = 0;
  items.forEach(it => {
    if(!it.who.length) return;
    const share = it.amt * svc / it.who.length;
    it.who.forEach(j => totals[j] += share);
    grand += it.amt * svc;
  });
  box.innerHTML = names.map((n,j) =>
    `<div class="aa-line"><span>${n}</span><b>${fmt(totals[j])}</b></div>`).join('')
    + `<div class="aa-total">全單總數（${$('aaSvc').checked?'已加一':'未加一'}）：${fmt(grand)}</div>`;
}
$('aaSvc').onchange = calc;
$('aaAddItem').addEventListener('click', calc);

$('aaCopy').onclick = () => {
  if(!names.length || !items.length) return;
  const svc = $('aaSvc').checked ? 1.1 : 1;
  const totals = names.map(() => 0);
  let grand = 0;
  items.forEach(it => {
    if(!it.who.length) return;
    const share = it.amt * svc / it.who.length;
    it.who.forEach(j => totals[j] += share);
    grand += it.amt * svc;
  });
  let txt = '🍻 飯局分帳\n' + items.map(it => `・${it.name} ${fmt(it.amt)}`).join('\n')
    + `\n（${$('aaSvc').checked ? '已' : '未'}加一服務費）\n\n每人應俾：\n`
    + names.map((n,j) => `${n}：${fmt(totals[j])}`).join('\n')
    + `\n\n總數：${fmt(grand)}`;
  navigator.clipboard.writeText(txt).then(() => {
    $('aaCopy').textContent = '✅ 已複製！去 WhatsApp 貼上啦';
    setTimeout(() => $('aaCopy').textContent = '📋 複製結果，貼去 WhatsApp', 2000);
  });
};
</script>
</body>
</html>
